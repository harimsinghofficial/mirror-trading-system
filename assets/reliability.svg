<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="300" rx="16" fill="#0b1020" stroke="#243356"/>
  <text x="40" y="52" fill="#e6edf7" font-size="26" font-weight="800">Three layers of reliability</text>
  <text x="40" y="80" fill="#8ea3c6" font-size="15">Each layer catches what the faster one above it misses — speed and safety don't trade off.</text>

  <!-- Layer 1 -->
  <g>
    <rect x="40" y="110" width="360" height="150" rx="14" fill="#0e2233" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="78" cy="146" r="16" fill="#102a44"/><text x="78" y="151" fill="#58a6ff" font-size="16" font-weight="800" text-anchor="middle">1</text>
    <text x="104" y="151" fill="#e6edf7" font-size="18" font-weight="700">Fast path</text>
    <text x="60" y="186" fill="#9fc6ef" font-size="14">Order-update WebSocket → convergence</text>
    <rect x="60" y="206" width="150" height="30" rx="15" fill="#06263b" stroke="#1f6feb"/>
    <text x="135" y="226" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">milliseconds</text>
  </g>
  <!-- Layer 2 -->
  <g>
    <rect x="420" y="110" width="360" height="150" rx="14" fill="#1a1530" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="458" cy="146" r="16" fill="#241a44"/><text x="458" y="151" fill="#a78bfa" font-size="16" font-weight="800" text-anchor="middle">2</text>
    <text x="484" y="151" fill="#e6edf7" font-size="18" font-weight="700">REST safety net</text>
    <text x="440" y="186" fill="#c3b5ef" font-size="14">Order-book poll re-emits missed fills</text>
    <rect x="440" y="206" width="150" height="30" rx="15" fill="#1c1240" stroke="#8b5cf6"/>
    <text x="515" y="226" fill="#a78bfa" font-size="14" font-weight="700" text-anchor="middle">every 0.3 s</text>
  </g>
  <!-- Layer 3 -->
  <g>
    <rect x="800" y="110" width="360" height="150" rx="14" fill="#0e2a22" stroke="#22d3a7" stroke-width="2"/>
    <circle cx="838" cy="146" r="16" fill="#0f3328"/><text x="838" y="151" fill="#34e0b0" font-size="16" font-weight="800" text-anchor="middle">3</text>
    <text x="864" y="151" fill="#e6edf7" font-size="18" font-weight="700">Reconciler</text>
    <text x="820" y="186" fill="#9fe6d2" font-size="14">Independent drift corrector + guards</text>
    <rect x="820" y="206" width="150" height="30" rx="15" fill="#0b3328" stroke="#22d3a7"/>
    <text x="895" y="226" fill="#34e0b0" font-size="14" font-weight="700" text-anchor="middle">~3 s · last resort</text>
  </g>

  <g stroke="#3b4c73" stroke-width="2.5" fill="none" marker-end="url(#a2)">
    <path d="M400 185 L 420 185"/>
    <path d="M780 185 L 800 185"/>
  </g>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b4c73"/>
    </marker>
  </defs>
</svg>
